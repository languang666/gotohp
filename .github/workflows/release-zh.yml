name: Publish Chinese Windows Release

on:
  workflow_dispatch:
  push:
    branches: [codex/simplified-chinese]
    paths: [.github/workflows/release-zh.yml]

permissions:
  contents: write

concurrency:
  group: release-zh-windows
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'languang666/gotohp'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v0.11.0-zh-CN.1
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check and build Chinese frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows executable with application resources
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.21
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -tags production -trimpath -buildvcs=false '-ldflags=-w -s -H windowsgui' -o bin/gotohp-zh.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package portable application and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "gotohp-$env:RELEASE_TAG-windows-x64"
          $folder = Join-Path 'release' $name
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item bin/gotohp-zh.exe (Join-Path $folder 'gotohp-zh.exe')
          Copy-Item LICENSE (Join-Path $folder 'LICENSE.txt')
          Copy-Item README.zh-CN.md (Join-Path $folder 'README.zh-CN.md')
          New-Item -ItemType File -Path (Join-Path $folder 'gotohp.config') | Out-Null
          @('解压后运行 gotohp-zh.exe。需要 Microsoft Edge WebView2 Runtime。',
            '首次使用请添加自己的账号。此包仅包含空白配置。',
            '升级请保留自己的 gotohp.config，不要用空白配置覆盖已有配置。',
            '若需保留源文件，请关闭“上传后删除源文件”。',
            "Source commit: $env:GITHUB_SHA") | Set-Content (Join-Path $folder '使用说明.txt') -Encoding utf8
          Compress-Archive -LiteralPath $folder -DestinationPath "release/$name.zip"
          Copy-Item bin/gotohp-zh.exe "release/$name.exe"
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @('## 简体中文 Windows x64 便携版',
            '',
            '基于上游 v0.11.0，汉化主界面、上传入口、设置、账号连接与进度提示。',
            '',
            '推荐下载 ZIP，解压后运行 gotohp-zh.exe；单独 EXE 适合已有用户升级。',
            '升级时请保留自己的 gotohp.config。发布包不含任何账号凭据或个人照片。',
            '需要 Microsoft Edge WebView2 Runtime。少量底层错误仍可能显示英文。',
            '',
            '第三方非官方客户端，免配额上传并非 Google 官方权益保证。沿用上游 MIT 许可。',
            '',
            "Source commit: $env:GITHUB_SHA") | Set-Content release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: gotohp-zh-windows-x64
          path: |
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish release with verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it.' }
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'gotohp v0.11.0 简体中文版 · Windows x64' --notes-file release-notes.md --draft
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

